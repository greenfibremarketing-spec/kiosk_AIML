name: Python reliability and dependency checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run deterministic offline tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Install isolated advisory scanner
        run: |
          python -m venv .venv-security
          .venv-security/bin/python -m pip install pip-audit==2.10.1
      - name: Scan installed application dependencies
        run: |
          SITE_PATH=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          .venv-security/bin/python -m pip_audit --path "$SITE_PATH" --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
